      <g transform="translate(211 -99)"><circle r="31" fill="#312A58" stroke="#B99AFF" stroke-width="2.5"/><path d="M0 -18L13 10H-13Z" fill="none" stroke="#EAD6FF" stroke-width="2"/><circle r="5" fill="#D7B6FF"/><text y="51" fill="#E4D2FF">GEM</text></g>
      <g transform="translate(-235 88)"><circle r="31" fill="#423424" stroke="#F5C57A" stroke-width="2.5"/><path d="M-11 -12H11V10H-11Z" fill="none" stroke="#FFEDD1" stroke-width="2"/><path d="M-6 -4H6M-6 3H3" stroke="#FFEDD1" stroke-width="2"/><text y="51" fill="#FCE5AF">BOONS</text></g>
      <g transform="translate(238 88)"><circle r="31" fill="#1B3059" stroke="#80C5F9" stroke-width="2.5"/><path d="M0 -19L15 -9V10L0 19L-15 10V-9Z" fill="none" stroke="#C3E8FF" stroke-width="2"/><path d="M-8 0H8" stroke="#C3E8FF" stroke-width="2"/><text y="51" fill="#B6DBFF">FINCH</text></g>
      <g transform="translate(0 -162)"><circle r="30" fill="#32214B" stroke="#DBBAF4" stroke-width="2.5"/><circle r="13" fill="none" stroke="#FFE8FF" stroke-width="2"/><path d="M-13 0H13M0 -13V13" stroke="#FFE8FF" stroke-width="1.6"/><text y="-43" fill="#EFD7FF">BUDDY*</text></g>
      <g transform="translate(0 127)"><circle r="37" fill="#164B42" stroke="#85F0D4" stroke-width="3" filter="url(#glow)"/><path d="M0 -19L14 -10L10 11L0 21L-10 11L-14 -10Z" fill="none" stroke="#C2FFE5" stroke-width="2"/><path d="M-7 1L-1 8L8 -5" stroke="#C2FFE5" stroke-width="2.5"/><text y="61" fill="#D2FFE9">JAY · HUMAN</text></g>
    </g>
  </g>
  <text x="1217" y="454" text-anchor="end" fill="#8799B5" font-family="Arial, Helvetica, sans-serif" font-size="11">*CONCEPTUAL SEAT — NOT LIVE PRESENCE</text>
