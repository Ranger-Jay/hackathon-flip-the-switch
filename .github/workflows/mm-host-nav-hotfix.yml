name: Public Council MM Host navigation hotfix

on:
  push:
    branches:
      - fix/mm-host-nav-public-20261107

permissions:
  contents: read

concurrency:
  group: mm-host-nav-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-minimal-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact hotfix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm runtime
        run: |
          python3 --version
          node --version
      - name: Verify Core receipt adapter
        run: python3 scripts/test_live_bridge.py
      - name: Run original Council UI matrix with MM Host click regression
        run: python3 scripts/run_all_ui_checks.py
